# Runs thermal on the Raspberry Pi from the image CI publishes. deploy/install.sh
# puts this in /opt/thermal with a timer that pulls updates.
#
# THERMAL_TAG in .env picks the channel: latest (releases), edge (main) or a
# version such as 0.2.0.
services:
  thermal:
    image: ghcr.io/connordoman/thermal:${THERMAL_TAG:-latest}
    restart: unless-stopped
    # Long enough for a job that is printing to finish before an update.
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - thermal-data:/data
      # The printer's /dev/usb/lpN node appears and disappears as it is
      # plugged in and out, so share /dev rather than one fixed device...
      - /dev:/dev
    device_cgroup_rules:
      # ...but only allow access to USB printers (usblp, major number 180).
      - "c 180:* rmw"
    group_add:
      - "7" # lp, which owns /dev/usb/lp* on Raspberry Pi OS
volumes:
  thermal-data:
